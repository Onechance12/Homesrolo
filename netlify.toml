[build]
  command = "npm ci && npm --prefix apps/homeowner ci && npm --prefix apps/mobile ci && npm --prefix apps/mobile run export:web:hosted && npm --prefix apps/homeowner run build"
  publish = "apps/homeowner/.next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  NEXT_PUBLIC_HOMESROLO_PORT_MODE = "remote"
  HOMESROLO_APP_ORIGIN = "https://app.homesrolo.com"
  HOMESROLO_EMAIL_CODE_SIGN_IN_ENABLED = "true"
  HOMESROLO_SELF_SIGNUP_ENABLED = "false"
  HOMESROLO_PRIVATE_UPLOADS_ENABLED = "true"
  HOMESROLO_PHOTO_CHECKUPS_ENABLED = "true"
  HOMESROLO_PROJECT_QUOTES_ENABLED = "false"
  HOMESROLO_PROFESSIONAL_INVITATIONS_ENABLED = "false"
  HOMESROLO_AI_ENABLED = "true"
  HOMESROLO_ROLO_VISION_ENABLED = "true"
  EXPO_PUBLIC_HOMESROLO_API_URL = "https://app.homesrolo.com"
  EXPO_PUBLIC_HOMESROLO_PREVIEW_MODE = "0"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(self), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co; worker-src 'self'; manifest-src 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/expo-shell-assets.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
