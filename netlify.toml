[build]
  command = "npm ci && npm --prefix apps/homeowner ci && npm --prefix apps/homeowner run build"
  publish = "apps/homeowner/.next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  NEXT_PUBLIC_HOMESROLO_PORT_MODE = "remote"
  HOMESROLO_APP_ORIGIN = "https://app.homesrolo.com"
  HOMESROLO_EMAIL_CODE_SIGN_IN_ENABLED = "true"
  HOMESROLO_SELF_SIGNUP_ENABLED = "false"
  HOMESROLO_PRIVATE_UPLOADS_ENABLED = "true"
  HOMESROLO_PHOTO_CHECKUPS_ENABLED = "true"
  HOMESROLO_PROJECT_QUOTES_ENABLED = "true"
  HOMESROLO_PROFESSIONAL_INVITATIONS_ENABLED = "true"
  HOMESROLO_AI_ENABLED = "true"
  HOMESROLO_ROLO_VISION_ENABLED = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=(self), payment=(), usb=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"
