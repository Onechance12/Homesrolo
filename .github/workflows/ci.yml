name: Homesrolo CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    name: Verify contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Constitution and contract tests
        run: npm test
