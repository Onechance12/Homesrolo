# Lane-scoped CI for the Phase 1 homeowner application shell.
# Deliberately a separate workflow from ci.yml: the integration lane owns that
# file. This lane follows the homeowner app together with the private runtime,
# migrations, and the one versioned Jobrolo handoff contract it consumes.

name: Homeowner app

on:
  push:
    branches: ['**']
    paths:
      - 'apps/homeowner/**'
      - 'src/homeowner/**'
      - 'src/contracts/homesrolo-jobrolo-project-intake.v1.ts'
      - 'supabase/migrations/**'
      - '.github/workflows/homeowner-app.yml'
  pull_request:
    paths:
      - 'apps/homeowner/**'
      - 'src/homeowner/**'
      - 'src/contracts/homesrolo-jobrolo-project-intake.v1.ts'
      - 'supabase/migrations/**'
      - '.github/workflows/homeowner-app.yml'

jobs:
  homeowner:
    name: Homeowner application shell
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/homeowner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/homeowner/package-lock.json
      - name: Install shared contract dependencies
        working-directory: .
        run: npm ci
      - name: Install homeowner app dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Port, fixture, and presentation tests
        run: npm test
      - name: Production build
        run: npm run build
